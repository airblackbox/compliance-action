name: 'AIR Blackbox Compliance Scan'
description: 'Scan Python AI projects for EU AI Act compliance. Checks 51+ requirements across 6 articles. Fails the build if compliance score drops below threshold.'
author: 'AIR Blackbox'

branding:
  icon: 'shield'
  color: 'yellow'

inputs:
  path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  threshold:
    description: 'Minimum compliance score (0-100). Build fails if score is below this. Set to 0 to never fail.'
    required: false
    default: '0'
  fail-on:
    description: 'Fail the build on findings of this severity or higher: high, medium, low, or none'
    required: false
    default: 'none'
  frameworks:
    description: 'Comma-separated list of frameworks to check, or "all". Options: eu-ai-act, iso-42001, nist-ai-rmf, colorado-sb-205'
    required: false
    default: 'eu-ai-act'
  version:
    description: 'Version of air-compliance-checker to install (default: latest)'
    required: false
    default: 'latest'
  comment:
    description: 'Post scan results as a PR comment (true/false). Requires GITHUB_TOKEN.'
    required: false
    default: 'true'
  badge:
    description: 'Generate a compliance badge SVG in the repo (true/false)'
    required: false
    default: 'false'
  json-output:
    description: 'Path to write raw JSON scan results (empty = skip)'
    required: false
    default: ''

outputs:
  score:
    description: 'Overall compliance score (0-100)'
  total-findings:
    description: 'Total number of compliance findings'
  high-findings:
    description: 'Number of high-severity findings'
  medium-findings:
    description: 'Number of medium-severity findings'
  low-findings:
    description: 'Number of low-severity findings'
  passed:
    description: 'Whether the scan passed all thresholds (true/false)'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install air-compliance-checker
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          pip install air-compliance-checker --quiet
        else
          pip install "air-compliance-checker==${{ inputs.version }}" --quiet
        fi

    - name: Run compliance scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FRAMEWORKS: ${{ inputs.frameworks }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_BADGE: ${{ inputs.badge }}
        INPUT_JSON_OUTPUT: ${{ inputs.json-output }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash ${{ github.action_path }}/scan.sh
